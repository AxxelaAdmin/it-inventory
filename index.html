<!DOCTYPE html>
<html>

<head>

  <title>IT Inventory Sheet</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>

    body {

      font-family: 'Segoe UI', sans-serif;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      margin: 0;

    }


    .container {

      max-width: 800px;

      margin: 40px auto;

      background: #fff;

      padding: 30px;

      border-radius: 15px;

      box-shadow:
        0 15px 30px
        rgba(0,0,0,0.2);

    }


    .title {

      text-align: center;

      font-size: 26px;

      font-weight: bold;

      margin-bottom: 20px;

    }


    .searchArea {

      display: flex;

      gap: 10px;

      margin-bottom: 10px;

    }


    .searchArea input {

      flex: 1;

    }


    .searchArea button {

      width: 120px;

      margin-top: 0;

    }


    .grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

    }


    input,
    select {

      padding: 12px;

      border-radius: 8px;

      border: 1px solid #ccc;

      font-size: 14px;

      box-sizing: border-box;

      width: 100%;

    }


    input:disabled,
    select:disabled {

      background: #eeeeee;

      color: #555;

      cursor: not-allowed;

    }


    .full {

      grid-column:
        span 2;

    }


    button {

      width: 100%;

      padding: 12px;

      background:
        linear-gradient(
          90deg,
          #667eea,
          #5a67d8
        );

      color: white;

      border: none;

      border-radius: 8px;

      margin-top: 10px;

      cursor: pointer;

      font-weight: 600;

    }


    button:hover {

      opacity: 0.9;

    }


    .updateBtn {

      background:
        linear-gradient(
          90deg,
          #16a34a,
          #15803d
        );

    }


    .cancelBtn {

      background:
        linear-gradient(
          90deg,
          #dc2626,
          #b91c1c
        );

    }


    .editStatus {

      display: none;

      background: #fff7ed;

      border: 1px solid #fdba74;

      color: #9a3412;

      padding: 10px;

      border-radius: 8px;

      margin-top: 10px;

      text-align: center;

      font-size: 13px;

      font-weight: 600;

    }


    @media (max-width: 600px) {

      .container {

        margin: 15px;

        padding: 20px;

      }


      .grid {

        grid-template-columns: 1fr;

      }


      .full {

        grid-column:
          span 1;

      }


      .searchArea {

        flex-direction: column;

      }


      .searchArea button {

        width: 100%;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================
       TITLE
       ===================================== -->

  <div class="title">

    💻 IT Inventory Sheet

  </div>


  <!-- =====================================
       SEARCH
       ===================================== -->

  <div class="searchArea">

    <input
      id="searchSerial"
      placeholder="Search by Serial Number / User Name"
      autocomplete="off"
    >

    <button
      onclick="searchData()"
    >
      🔍 Search
    </button>

  </div>


  <div
    id="editStatus"
    class="editStatus"
  >
  </div>


  <hr>


  <!-- =====================================
       INVENTORY FORM
       ===================================== -->

  <div class="grid">


    <select
      id="location"
      class="full"
    >

      <option value="">
        Select Location
      </option>

      <option value="Kolkata">
        Kolkata
      </option>

      <option value="Mumbai">
        Mumbai
      </option>

      <option value="Gurgaon">
        Gurgaon
      </option>

      <option value="Bangalore">
        Bangalore
      </option>

    </select>


    <input
      id="user"
      placeholder="User"
    >


    <input
      id="make"
      placeholder="Make"
    >


    <input
      id="model"
      list="modelList"
      placeholder="Model"
    >


    <input
      id="machineType"
      list="machineTypeList"
      placeholder="Machine Type"
    >


    <input
      id="serialNumber"
      placeholder="Serial Number (Required)"
    >


    <input
      id="ram"
      placeholder="RAM"
    >


    <input
      id="storage"
      placeholder="Storage"
    >


    <input
      id="processor"
      list="processorList"
      placeholder="Processor"
    >


    <input
      id="os"
      placeholder="OS Version"
    >


    <input
      id="monitor"
      placeholder="Nos Of Monitor"
    >


    <input
      id="ip"
      placeholder="IP Address"
    >


    <input
      id="platform"
      placeholder="Platform"
    >


    <input
      id="ill"
      placeholder="ILL Details"
    >


    <input
      id="hostname"
      placeholder="Hostname"
    >

  </div>


  <!-- =====================================
       SUBMIT
       ===================================== -->

  <button
    id="submitBtn"
    onclick="submitData()"
  >

    Submit

  </button>


  <!-- =====================================
       UPDATE
       ===================================== -->

  <button
    id="updateBtn"
    class="updateBtn"
    onclick="updateRecord()"
    style="display:none;"
  >

    Update Record

  </button>


  <!-- =====================================
       CANCEL
       ===================================== -->

  <button
    id="cancelBtn"
    class="cancelBtn"
    onclick="cancelEdit()"
    style="display:none;"
  >

    Cancel Edit

  </button>


</div>


<iframe
  id="hiddenFrame"
  style="display:none;"
></iframe>


<script>


// =====================================
// GOOGLE APPS SCRIPT URL
// =====================================

var url =
"https://script.google.com/macros/s/AKfycbxIfXVkCc3z1sOZ0PW4r07NMlMBsj_M2f60IYR1bDQoNQt-LUQ0mCG_yhI3Ev3s9efD/exec";


// =====================================
// CURRENT RECORD
// =====================================

var currentRecord = null;


// =====================================
// LOAD PAGE
// =====================================

document.addEventListener(
  "DOMContentLoaded",
  function() {


    // =================================
    // CREATE DATALISTS
    // =================================

    document.body.insertAdjacentHTML(
      "beforeend",
      `
      <datalist id="modelList"></datalist>

      <datalist id="machineTypeList"></datalist>

      <datalist id="processorList"></datalist>
      `
    );


    // =================================
    // LOAD SUGGESTIONS
    // =================================

    fetch(
      url + "?action=suggestions"
    )

    .then(function(res) {

      return res.json();

    })

    .then(function(data) {


      fillList(
        "modelList",
        data.model || []
      );


      fillList(
        "machineTypeList",
        data.machineType || []
      );


      fillList(
        "processorList",
        data.processor || []
      );

    })

    .catch(function(err) {

      console.log(
        "Suggestion Error:",
        err
      );

    });


    // =================================
    // CLEAR SEARCH
    // =================================

    document
      .getElementById("searchSerial")
      .addEventListener(
        "input",
        function() {

          if (
            this.value.trim() === ""
          ) {

            cancelEdit();

          }

        }
      );

  }
);


// =====================================
// FILL SUGGESTION LIST
// =====================================

function fillList(
  id,
  arr
) {

  var html = "";


  arr.forEach(
    function(item) {

      html +=
        '<option value="' +
        escapeHtml(item) +
        '">';

    }
  );


  document
    .getElementById(id)
    .innerHTML = html;

}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// =====================================
// ENABLE ALL FIELDS
// =====================================

function enableAllFields() {

  document
    .querySelectorAll(
      "#location, #user, #make, #model, #machineType, #serialNumber, #ram, #storage, #processor, #os, #monitor, #ip, #platform, #ill, #hostname"
    )
    .forEach(
      function(element) {

        element.disabled = false;

      }
    );

}


// =====================================
// CLEAR FORM
// =====================================

function clearForm() {

  document
    .querySelectorAll(
      "#location, #user, #make, #model, #machineType, #serialNumber, #ram, #storage, #processor, #os, #monitor, #ip, #platform, #ill, #hostname"
    )
    .forEach(
      function(element) {

        if (
          element.tagName ==
          "SELECT"
        ) {

          element.selectedIndex = 0;

        }
        else {

          element.value = "";

        }

      }
    );


  enableAllFields();


  currentRecord = null;


  document
    .getElementById("updateBtn")
    .style.display = "none";


  document
    .getElementById("cancelBtn")
    .style.display = "none";


  document
    .getElementById("editStatus")
    .style.display = "none";


  document
    .getElementById("submitBtn")
    .style.display = "block";

}


// =====================================
// LOCK SEARCH REFERENCE
// =====================================

function lockReference(
  searchType
) {


  enableAllFields();


  // =================================
  // LOCATION ALWAYS LOCKED
  // =================================

  document
    .getElementById("location")
    .disabled = true;


  // =================================
  // SERIAL SEARCH
  // =================================

  if (
    searchType == "serial"
  ) {

    document
      .getElementById("serialNumber")
      .disabled = true;


    document
      .getElementById("editStatus")
      .innerText =
      "🔒 Serial Number locked. Other details can be edited.";

  }


  // =================================
  // USER SEARCH
  // =================================

  if (
    searchType == "user"
  ) {

    document
      .getElementById("user")
      .disabled = true;


    document
      .getElementById("editStatus")
      .innerText =
      "🔒 User / Name locked. Other details can be edited.";

  }


  document
    .getElementById("editStatus")
    .style.display = "block";

}


// =====================================
// SUBMIT NEW RECORD
// =====================================

function submitData() {


  var data = {

    location:
      document
        .getElementById("location")
        .value,

    user:
      document
        .getElementById("user")
        .value,

    make:
      document
        .getElementById("make")
        .value,

    model:
      document
        .getElementById("model")
        .value,

    machineType:
      document
        .getElementById("machineType")
        .value,

    serialNumber:
      document
        .getElementById("serialNumber")
        .value,

    ram:
      document
        .getElementById("ram")
        .value,

    storage:
      document
        .getElementById("storage")
        .value,

    processor:
      document
        .getElementById("processor")
        .value,

    os:
      document
        .getElementById("os")
        .value,

    monitor:
      document
        .getElementById("monitor")
        .value,

    ip:
      document
        .getElementById("ip")
        .value,

    platform:
      document
        .getElementById("platform")
        .value,

    ill:
      document
        .getElementById("ill")
        .value,

    hostname:
      document
        .getElementById("hostname")
        .value

  };


  if (!data.serialNumber) {

    alert(
      "Serial Number required!"
    );

    return;

  }


  fetch(
    url +
    "?data=" +
    encodeURIComponent(
      JSON.stringify(data)
    )
  )

  .then(function(res) {

    return res.text();

  })

  .then(function(msg) {


    if (
      msg.indexOf("SUCCESS") >= 0
    ) {

      alert(
        "✅ Data Saved!"
      );


      document
        .getElementById("searchSerial")
        .value = "";


      clearForm();

    }
    else {

      alert(msg);

    }

  })

  .catch(function(err) {

    alert(
      "Error: " + err
    );

  });

}


// =====================================
// SEARCH
// =====================================

function searchData() {


  var searchValue =
    document
      .getElementById("searchSerial")
      .value
      .trim();


  if (!searchValue) {

    return;

  }


  // Reset old edit mode
  clearForm();


  fetch(
    url +
    "?search=" +
    encodeURIComponent(
      searchValue
    )
  )

  .then(function(res) {

    return res.json();

  })

  .then(function(res) {


    if (
      res.status != "found"
    ) {

      alert(
        "❌ No Data Found"
      );

      return;

    }


    var d = res.data;


    // =================================
    // FILL FORM
    // =================================

    document
      .getElementById("location")
      .value =
      res.sheetName || "";


    document
      .getElementById("user")
      .value =
      d[1] || "";


    document
      .getElementById("make")
      .value =
      d[2] || "";


    document
      .getElementById("model")
      .value =
      d[3] || "";


    document
      .getElementById("machineType")
      .value =
      d[4] || "";


    document
      .getElementById("serialNumber")
      .value =
      d[5] || "";


    document
      .getElementById("ram")
      .value =
      d[6] || "";


    document
      .getElementById("storage")
      .value =
      d[7] || "";


    document
      .getElementById("processor")
      .value =
      d[8] || "";


    document
      .getElementById("os")
      .value =
      d[9] || "";


    document
      .getElementById("monitor")
      .value =
      d[10] || "";


    document
      .getElementById("ip")
      .value =
      d[11] || "";


    document
      .getElementById("platform")
      .value =
      d[12] || "";


    document
      .getElementById("ill")
      .value =
      d[13] || "";


    document
      .getElementById("hostname")
      .value =
      d[14] || "";


    // =================================
    // SAVE EXISTING ROW REFERENCE
    // =================================

    currentRecord = {

      sheetName:
        res.sheetName,

      rowNumber:
        res.rowNumber,

      searchType:
        res.searchType

    };


    // =================================
    // LOCK REFERENCE
    // =================================

    lockReference(
      res.searchType
    );


    // =================================
    // SHOW UPDATE
    // =================================

    document
      .getElementById("updateBtn")
      .style.display =
      "block";


    document
      .getElementById("cancelBtn")
      .style.display =
      "block";


    document
      .getElementById("submitBtn")
      .style.display =
      "none";


    // =================================
    // ❌ NO POPUP HERE
    // =================================

  })

  .catch(function(err) {

    alert(
      "Search Error: " + err
    );

  });

}


// =====================================
// UPDATE RECORD
// =====================================

function updateRecord() {


  if (!currentRecord) {

    return;

  }


  var data = {

    // Existing row reference
    sheetName:
      currentRecord.sheetName,

    rowNumber:
      currentRecord.rowNumber,

    searchType:
      currentRecord.searchType,


    // Current form values
    user:
      document
        .getElementById("user")
        .value,

    make:
      document
        .getElementById("make")
        .value,

    model:
      document
        .getElementById("model")
        .value,

    machineType:
      document
        .getElementById("machineType")
        .value,

    serialNumber:
      document
        .getElementById("serialNumber")
        .value,

    ram:
      document
        .getElementById("ram")
        .value,

    storage:
      document
        .getElementById("storage")
        .value,

    processor:
      document
        .getElementById("processor")
        .value,

    os:
      document
        .getElementById("os")
        .value,

    monitor:
      document
        .getElementById("monitor")
        .value,

    ip:
      document
        .getElementById("ip")
        .value,

    platform:
      document
        .getElementById("platform")
        .value,

    ill:
      document
        .getElementById("ill")
        .value,

    hostname:
      document
        .getElementById("hostname")
        .value

  };


  if (!data.serialNumber) {

    alert(
      "Serial Number required!"
    );

    return;

  }


  var updateBtn =
    document
      .getElementById(
        "updateBtn"
      );


  updateBtn.disabled = true;

  updateBtn.innerText =
    "Updating...";


  fetch(
    url +
    "?action=update&data=" +
    encodeURIComponent(
      JSON.stringify(data)
    )
  )

  .then(function(res) {

    return res.json();

  })

  .then(function(res) {


    updateBtn.disabled = false;

    updateBtn.innerText =
      "Update Record";


    if (
      res.status == "updated"
    ) {

      alert(
        "✅ Record Updated Successfully!"
      );


      document
        .getElementById(
          "searchSerial"
        )
        .value = "";


      clearForm();

    }
    else {

      alert(
        "❌ Update Failed: " +
        (res.message || "")
      );

    }

  })

  .catch(function(err) {


    updateBtn.disabled = false;

    updateBtn.innerText =
      "Update Record";


    alert(
      "Update Error: " +
      err
    );

  });

}


// =====================================
// CANCEL EDIT
// =====================================

function cancelEdit() {


  document
    .getElementById(
      "searchSerial"
    )
    .value = "";


  clearForm();

}

</script>


</body>

</html>
