<!DOCTYPE html>
<html>
<head>
  <title>IT Inventory Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    .title {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input, select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .full {
      grid-column: span 2;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #667eea, #5a67d8);
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">💻 IT Inventory Sheet</div>

  <!-- 🔍 SEARCH -->
  <input id="searchSerial" placeholder="Search by Serial Number" class="full">
  <button onclick="searchData()">Search</button>

  <hr>

  <div class="grid">

    <select id="location" class="full">
      <option value="">Select Location</option>
      <option>Kolkata</option>
      <option>Mumbai</option>
      <option>Gurgaon</option>
      <option>Bangalore</option>
    </select>

    <input id="user" placeholder="User">
    <input id="make" placeholder="Make">
    <input id="model" list="modelList" placeholder="Model">
    <input id="machineType" list="machineTypeList" placeholder="Machine Type">
    <input id="serialNumber" placeholder="Serial Number (Required)">
    <input id="ram" placeholder="RAM">
    <input id="storage" placeholder="Storage">
    <input id="processor" list="processorList" placeholder="Processor">
    <input id="os" placeholder="OS Version">
    <input id="monitor" placeholder="Nos Of Monitor">
    <input id="ip" placeholder="IP Address">
    <input id="platform" placeholder="Platform">
    <input id="ill" placeholder="ILL Details">
    <input id="hostname" placeholder="Hostname">

  </div>

  <button onclick="submitData()">Submit</button>

</div>

<!-- 🔥 Hidden iframe -->
<iframe id="hiddenFrame" style="display:none;"></iframe>

<script>
var url = "https://script.google.com/macros/s/AKfycbxIfXVkCc3z1sOZ0PW4r07NMlMBsj_M2f60IYR1bDQoNQt-LUQ0mCG_yhI3Ev3s9efD/exec";


// =============================
// AUTO SUGGESTION
// =============================
document.addEventListener("DOMContentLoaded", function () {

  document.body.insertAdjacentHTML("beforeend", `
    <datalist id="modelList"></datalist>
    <datalist id="machineTypeList"></datalist>
    <datalist id="processorList"></datalist>
  `);

  fetch(url + "?action=suggestions")
    .then(res => res.json())
    .then(data => {

      fillList("modelList", data.model || []);
      fillList("machineTypeList", data.machineType || []);
      fillList("processorList", data.processor || []);

      document.getElementById("model").setAttribute("list", "modelList");
      document.getElementById("machineType").setAttribute("list", "machineTypeList");
      document.getElementById("processor").setAttribute("list", "processorList");

    })
    .catch(err => console.log(err));

  document.getElementById("searchSerial").addEventListener("input", function () {
    if (this.value === "") {
      clearForm();
    }
  });

});


function fillList(id, arr) {

  let html = "";

  arr.forEach(function(item) {
    html += '<option value="' + item + '">';
  });

  document.getElementById(id).innerHTML = html;

}


// ✅ CLEAR FORM
function clearForm() {
